name: CI & Deploy

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch: {} # manual "go live" trigger — deploy only fires from here

jobs:
  # Enforces the colour Laws in guidelines/Guidelines.md. Runs alongside the
  # tests rather than gating them — a token violation and a broken test are
  # independent failures, and seeing both at once is more useful than one
  # hiding the other. Deploy is unaffected: it still needs `test` only, and
  # still only fires on workflow_dispatch.
  lint-tokens:
    name: Token lint (L-C1 / L-C2 / L-G1)
    timeout-minutes: 5
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Lint design tokens
        run: node scripts/lint-tokens.mjs

  test:
    name: Build & E2E tests
    timeout-minutes: 20
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Install Playwright browser
        run: npx playwright install --with-deps chromium

      - name: Run Playwright tests
        run: npx playwright test

      - name: Upload Playwright report
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: playwright-report/
          retention-days: 30

  # Publishes to the live link (qaza-2so.pages.dev). Runs ONLY when the
  # workflow is triggered manually, and ONLY after the test job passes — so
  # a normal push/save never deploys, and broken code can never go live.
  deploy:
    name: Deploy to Cloudflare Pages
    needs: test
    if: github.event_name == 'workflow_dispatch'
    timeout-minutes: 15
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Build
        run: npm run build

      - name: Deploy to Cloudflare Pages
        uses: cloudflare/wrangler-action@v3
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          command: pages deploy dist --project-name=qaza --branch=main
